name: Execute course notebooks

on:
  push:
    branches: [main]
    paths:
      - "module_1/**/*.ipynb"
      - "module_2/**/*.ipynb"
      - "module_3/**/*.ipynb"
      - "module_1/README.md"
      - "module_2/README.md"
      - "module_3/README.md"
      - "README.md"
      - "START_HERE.md"
      - "GITHUB_GUIDE.md"
      - "index.html"
      - "script.js"
      - "requirements.txt"
      - "tools/check_notebook_style.py"
      - ".github/workflows/execute-notebooks.yml"
  pull_request:
    paths:
      - "module_1/**/*.ipynb"
      - "module_2/**/*.ipynb"
      - "module_3/**/*.ipynb"
      - "module_1/README.md"
      - "module_2/README.md"
      - "module_3/README.md"
      - "README.md"
      - "START_HERE.md"
      - "GITHUB_GUIDE.md"
      - "index.html"
      - "script.js"
      - "requirements.txt"
      - "tools/check_notebook_style.py"
      - ".github/workflows/execute-notebooks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-notebooks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install course environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pycodestyle>=2.12,<3"

      - name: Check notebook consistency and PEP 8
        run: python tools/check_notebook_style.py

      - name: Execute all course notebooks
        env:
          MPLBACKEND: module://matplotlib_inline.backend_inline
        run: |
          set -euo pipefail
          find module_1 module_2 module_3 -name '*.ipynb' -print0 \
            | sort -z \
            | while IFS= read -r -d '' notebook; do
                echo "Executing ${notebook}"
                jupyter nbconvert \
                  --to notebook \
                  --execute \
                  --inplace \
                  --ExecutePreprocessor.timeout=180 \
                  "${notebook}"
              done

      - name: Save refreshed outputs on main
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- module_1 module_2 module_3; then
            echo "Notebook outputs are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module_1 module_2 module_3
          git commit -m "Refresh executed notebook outputs [skip ci]"
          git push
