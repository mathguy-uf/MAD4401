name: Execute course notebooks

on:
  push:
    branches: [main]
    paths:
      - "module_1/**/*.ipynb"
      - "module_2/**/*.ipynb"
      - "module_3/**/*.ipynb"
      - "module_1/README.md"
      - "module_2/README.md"
      - "module_3/README.md"
      - "README.md"
      - "START_HERE.md"
      - "GITHUB_GUIDE.md"
      - "index.html"
      - "script.js"
      - "requirements.txt"
      - "tools/check_notebook_style.py"
      - ".github/workflows/execute-notebooks.yml"
  pull_request:
    paths:
      - "module_1/**/*.ipynb"
      - "module_2/**/*.ipynb"
      - "module_3/**/*.ipynb"
      - "module_1/README.md"
      - "module_2/README.md"
      - "module_3/README.md"
      - "README.md"
      - "START_HERE.md"
      - "GITHUB_GUIDE.md"
      - "index.html"
      - "script.js"
      - "requirements.txt"
      - "tools/check_notebook_style.py"
      - ".github/workflows/execute-notebooks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-notebooks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install course environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pycodestyle>=2.12,<3" "autopep8>=2.3,<3"

      - name: Format notebook Python cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import autopep8

          module_directories = ("module_1", "module_2", "module_3")
          selected_fixes = (
              "E128",
              "E225",
              "E226",
              "E231",
              "E302",
              "E305",
              "E501",
          )

          replacements = {
              "sol = solve_ivp(f, (0, 6), [y0], t_eval=t_eval, rtol=1e-9, atol=1e-11)": (
                  "sol = solve_ivp(\n"
                  "    f,\n"
                  "    (0, 6),\n"
                  "    [y0],\n"
                  "    t_eval=t_eval,\n"
                  "    rtol=1e-9,\n"
                  "    atol=1e-11,\n"
                  ")"
              ),
              "print(\"     h    steps       w(2)          exact          error      observed p\")": (
                  "header = (\n"
                  "    \"     h    steps       w(2)          exact\"\n"
                  "    \"          error      observed p\"\n"
                  ")\n"
                  "print(header)"
              ),
              "print(f\"{h:7.3f}   {n_steps:4d}   {w[-1]:12.8f}   {exact(2.0):12.8f}   {error:10.6f}   {p_text}\")": (
                  "row = (\n"
                  "    f\"{h:7.3f}   {n_steps:4d}   {w[-1]:12.8f}   \"\n"
                  "    f\"{exact(2.0):12.8f}   {error:10.6f}   {p_text}\"\n"
                  ")\n"
                  "print(row)"
              ),
          }

          for directory in module_directories:
              for path in sorted(Path(directory).glob("*.ipynb")):
                  notebook = json.loads(path.read_text(encoding="utf-8"))
                  changed = False

                  for cell in notebook.get("cells", []):
                      if cell.get("cell_type") != "code":
                          continue

                      source = cell.get("source", [])
                      code = "".join(source) if isinstance(source, list) else str(source)
                      if not code.strip():
                          continue

                      for old, new in replacements.items():
                          code = code.replace(old, new)

                      formatted = autopep8.fix_code(
                          code,
                          options={
                              "aggressive": 1,
                              "max_line_length": 79,
                              "select": selected_fixes,
                          },
                      )

                      original = (
                          "".join(source)
                          if isinstance(source, list)
                          else str(source)
                      )
                      if formatted != original:
                          cell["source"] = formatted.splitlines(keepends=True)
                          changed = True

                  if changed:
                      path.write_text(
                          json.dumps(notebook, indent=1, ensure_ascii=False) + "\n",
                          encoding="utf-8",
                      )
                      print(f"Formatted {path}")
          PY

      - name: Check notebook consistency and PEP 8
        run: python tools/check_notebook_style.py

      - name: Execute all course notebooks
        env:
          MPLBACKEND: module://matplotlib_inline.backend_inline
        run: |
          set -euo pipefail
          find module_1 module_2 module_3 -name '*.ipynb' -print0 \
            | sort -z \
            | while IFS= read -r -d '' notebook; do
                echo "Executing ${notebook}"
                jupyter nbconvert \
                  --to notebook \
                  --execute \
                  --inplace \
                  --ExecutePreprocessor.timeout=180 \
                  "${notebook}"
              done

      - name: Save refreshed outputs on main
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- module_1 module_2 module_3; then
            echo "Notebook outputs are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module_1 module_2 module_3
          git commit -m "Format and refresh course notebooks [skip ci]"
          git push
